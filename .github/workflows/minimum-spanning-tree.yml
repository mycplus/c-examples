name: minimum-spanning-tree

on:
  push:
    paths: ['graphs/minimum-spanning-tree/**', '.github/workflows/minimum-spanning-tree.yml']
  pull_request:
    paths: ['graphs/minimum-spanning-tree/**', '.github/workflows/minimum-spanning-tree.yml']

defaults:
  run:
    working-directory: graphs/minimum-spanning-tree

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        std: [11, 17]
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_C_STANDARD=${{ matrix.std }}
      - name: Build (warnings are errors)
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ASan and UBSan, every test
        run: |
          san="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
          cmake -S . -B asan -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS=$san" "-DCMAKE_CXX_FLAGS=$san"
          cmake --build asan
          ctest --test-dir asan --output-on-failure
      - name: UBSan stops the subtracting comparator
        run: |
          if ./asan/pitfall_subtract_compare > out.txt 2> err.txt; then
            echo "expected UBSan to stop the program"; exit 1
          fi
          grep -q "signed integer overflow" err.txt
      - name: Every deliberate mistake is caught
        run: python3 tests/mutations.py gcc

  msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        std: [11, 17]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build "-DCMAKE_C_STANDARD=${{ matrix.std }}"
      - name: Build (/W4 /WX)
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
