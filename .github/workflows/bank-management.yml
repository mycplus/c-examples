name: bank-management

on:
  push:
    paths: ['projects/bank-management/**', '.github/workflows/bank-management.yml']
  pull_request:
    paths: ['projects/bank-management/**', '.github/workflows/bank-management.yml']

defaults:
  run:
    working-directory: projects/bank-management

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        std: [11, 17]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_C_STANDARD=${{ matrix.std }}
      - name: Build (warnings are errors)
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ASan and UBSan, every test
        run: |
          cmake -S . -B asan -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -g"
          cmake --build asan
          ctest --test-dir asan --output-on-failure

  msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        std: [11, 17]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build "-DCMAKE_C_STANDARD=${{ matrix.std }}"
      - name: Build (/W4 /WX)
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
