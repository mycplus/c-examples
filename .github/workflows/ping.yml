name: Ping

# Runs only when this example (or this workflow) changes.
on:
  push:
    branches: [main]
    paths:
      - 'networking/ping/**'
      - '.github/workflows/ping.yml'
  pull_request:
    branches: [main]
    paths:
      - 'networking/ping/**'
      - '.github/workflows/ping.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ping-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gcc:
    name: GCC
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: networking/ping

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with GCC
        run: |
          gcc -std=c11 -Wall -Wextra -pedantic -Werror \
              src/ping.c \
              -o ping

      - name: Validation smoke test
        run: |
          set +e
          ./ping > output.txt 2>&1
          status=$?
          set -e

          cat output.txt

          test "$status" -eq 2
          grep -q "usage:" output.txt

  clang:
    name: Clang
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: networking/ping

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with Clang
        run: |
          clang -std=c11 -Wall -Wextra -pedantic -Werror \
                src/ping.c \
                -o ping

      - name: Validation smoke test
        run: |
          set +e
          ./ping > output.txt 2>&1
          status=$?
          set -e

          cat output.txt

          test "$status" -eq 2
          grep -q "usage:" output.txt

  msvc:
    name: MSVC
    runs-on: windows-latest
    defaults:
      run:
        working-directory: networking/ping

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with MSVC
        shell: cmd
        run: |
          cl /nologo /TC /W4 /WX ^
             src\ping-windows.c ^
             /link Ws2_32.lib ^
             /OUT:ping-windows.exe

      - name: Validation smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          & .\ping-windows.exe 2>&1 | Out-File -Encoding utf8 output.txt
          $status = $LASTEXITCODE

          Get-Content output.txt

          if ($status -ne 2) {
              Write-Host "::error::Expected exit code 2, got $status."
              exit 1
          }

          if (-not (Select-String -Path output.txt -Pattern 'usage:' -Quiet)) {
              Write-Host "::error::Expected usage message was not produced."
              exit 1
          }

          Write-Host "Smoke test passed."
          exit 0
          