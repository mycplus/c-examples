name: Sorting Algorithms

on:
  push:
    paths: ['sorting/sorting-algorithms/**', 'sorting/*/src/*_sort.c', '.github/workflows/sorting-algorithms.yml']
  pull_request:
    paths: ['sorting/sorting-algorithms/**', 'sorting/*/src/*_sort.c', '.github/workflows/sorting-algorithms.yml']

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        std: [11, 17]
    defaults:
      run:
        working-directory: sorting/sorting-algorithms
    steps:
      - uses: actions/checkout@v4
      - name: Functions match the article folders
        run: python3 tests/check_article_code.py
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_C_STANDARD=${{ matrix.std }}
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Sanitizers
        run: |
          cmake -S . -B asan -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_C_STANDARD=${{ matrix.std }} \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
          cmake --build asan
          # AddressSanitizer wraps qsort() and adds n - 1 comparator calls, so the
          # byte-exact comparison-count checks run only in the plain build above.
          ctest --test-dir asan --output-on-failure -E 'comparison_counts'

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sorting/sorting-algorithms
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (MSVC)
        run: |
          cmake -S . -B build
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
